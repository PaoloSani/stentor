# Builds Stentor for Windows and Linux (apps/desktop): tests, PyInstaller, a self-check of the built app,
# then the Windows installer and the Linux AppImage as artifacts. Run it by hand with a release tag to attach
# the files to that (existing) GitHub release.
name: Desktop (Windows, Linux)

on:
  push:
    branches: [main, multi-os]
    paths: ["apps/desktop/**", "assets/**", "VERSION", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", "assets/**", "VERSION", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the builds to this existing release (e.g. v0.4.0); empty = artifacts only"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
          - name: Linux
            os: ubuntu-22.04  # older glibc: the AppImage runs on more distributions
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # the demo recording

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/desktop/pyproject.toml

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 file

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"
          echo "VERSION=$(cat ../../VERSION)" >> "$GITHUB_ENV"

      - name: Lint and test
        run: |
          ruff check src/stentor_desktop tests
          pytest -q

      - name: Build (PyInstaller)
        run: pyinstaller --noconfirm --distpath build/dist --workpath build/work packaging/stentor.spec

      - name: Self-check of the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build\dist\Stentor\Stentor.exe" -ArgumentList "--bundle-check","build\bundle-check.txt","build\bundle-check.png" -Wait -PassThru
          Get-Content build\bundle-check.txt
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Self-check of the built app (Linux)
        if: runner.os == 'Linux'
        run: |
          build/dist/Stentor/Stentor --bundle-check build/bundle-check.txt build/bundle-check.png || { cat build/bundle-check.txt; exit 1; }
          cat build/bundle-check.txt

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /Qp "/DAppVersion=$env:VERSION" "packaging\windows\stentor.iss"
          Compress-Archive -Path build\dist\Stentor -DestinationPath "build\Stentor-$env:VERSION-Windows-portable.zip"

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o build/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 packaging/linux/make_appimage.sh "$VERSION" "$PWD/build/appimagetool"
          APPIMAGE_EXTRACT_AND_RUN=1 "build/Stentor-$VERSION-x86_64.AppImage" --bundle-check build/appimage-check.txt
          cat build/appimage-check.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Stentor-${{ env.VERSION }}-${{ matrix.name }}
          path: |
            apps/desktop/build/Stentor-*-Windows-Setup.exe
            apps/desktop/build/Stentor-*-Windows-portable.zip
            apps/desktop/build/Stentor-*.AppImage
            apps/desktop/build/Stentor-*-linux-x86_64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-check-${{ matrix.name }}
          path: |
            apps/desktop/build/*check*.txt
            apps/desktop/build/bundle-check.png
          if-no-files-found: ignore

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Stentor-*
          merge-multiple: true
          path: dist
      - name: Attach to ${{ inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/* --clobber --repo "${{ github.repository }}"
